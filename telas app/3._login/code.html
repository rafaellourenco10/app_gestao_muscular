"display-hero-mobile": [ "44px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "700" } ] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Subtle Ambient Glow Element -->
<div class="relative w-full flex flex-col items-center">
<div class="absolute -top-12 w-48 h-48 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
<!-- Brand Header -->
<div class="relative flex flex-col items-center mt-space-md mb-space-lg">
<div class="p-space-xs rounded-xl bg-surface-container-low shadow-sm mb-space-md flex items-center justify-center">
<img alt="FuncFit Logo" class="h-12 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WBAS5SoPGWA31tCgywSNLCKiQQEDNr_Gz2bCBkOhM7nhh8RyO7lUDPj5069W__0DIm44Aro-Up4boVhDGUgqa7rzbj6QQuMJgSW-i-I_FWUNQQfVORHaACbrBYptDqtKyTl7W7XRzwi-VBVV7jcrWW869vY50Nrlqfz1Ka-tmDLzuZz_MtaFXsYsDhXgarXxvdu41Z3F-RvkM546kuphvccujlKRr9z9Hh-zb5o_4kazw3niQjwvKJKP32"/>
</div>
<div class="inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-surface-container-high text-primary-container font-label-caps text-label-caps uppercase tracking-wider mb-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        Functional Athletics
      </div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center mb-1">
        Bem-vindo de volta
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-xs">
        Acesse sua conta para continuar seus treinos
      </p>
</div>
<!-- Motivational Daily Pulse Widget -->
<div class="w-full bg-surface-container-low rounded-xl p-space-md mb-space-lg flex items-center justify-between">
<div class="flex items-center gap-space-sm">
<div class="w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">SEQUÊNCIA ATIVA</span>
<span class="font-label-md text-label-md text-on-surface">5 dias ininterruptos</span>
</div>
</div>
<span class="font-label-md text-label-md text-primary-container bg-surface-container-highest px-space-sm py-1 rounded-lg">
        +340 XP
      </span>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- E-mail Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-1" for="email-input">
          E-mail
        </label>
<div class="relative flex items-center w-full bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors shadow-sm">
<span class="absolute left-space-md text-on-surface-variant flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[22px]">mail</span>
</span>
<input class="w-full bg-transparent py-4 pl-12 pr-space-md text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 focus:outline-none" id="email-input" placeholder="seu.email@funcfit.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-1" for="password-input">
          Senha
        </label>
<div class="relative flex items-center w-full bg-surface-container-low rounded-xl focus-within:bg-surface-container transition-colors shadow-sm">
<span class="absolute left-space-md text-on-surface-variant flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[22px]">lock</span>
</span>
<input class="w-full bg-transparent py-4 pl-12 pr-12 text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 focus:outline-none" id="password-input" placeholder="Digite sua senha" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-space-md text-on-surface-variant hover:text-on-surface active:scale-95 flex items-center p-1" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[22px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Controls Row: Remember me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-space-sm cursor-pointer select-none py-1">
<div class="relative flex items-center">
<input class="peer sr-only" id="remember-checkbox" type="checkbox"/>
<div class="w-6 h-6 rounded-lg bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-on-primary-container text-[18px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">
                check
              </span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors">
            Lembrar de mim
          </span>
</label>
<a class="font-label-md text-label-md text-primary-container/90 hover:text-primary-container active:opacity-75 transition-colors py-1" href="#recuperar-senha">
          Esqueci minha senha
        </a>
</div>
<!-- Primary Kinetic Action -->
<button class="w-full h-14 mt-space-sm rounded-xl bg-primary-container text-on-primary-container font-label-lg text-label-lg uppercase tracking-wide flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform shadow-lg shadow-primary-container/20 cursor-pointer" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</form>
<!-- Social Access Divider -->
<div class="relative w-full flex items-center justify-center my-space-lg">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-space-md bg-surface font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
        Ou acesse com
      </span>
</div>
<!-- Social Authentication Grid -->
<div class="grid grid-cols-2 gap-space-md w-full">
<!-- Apple Button -->
<button class="h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-space-sm active:scale-[0.98] transition-all cursor-pointer shadow-sm" type="button">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.9.04-2 .61-2.65 1.36-.57.65-1.06 1.73-.93 2.76 1.01.08 2.05-.5 2.66-1.25z"></path>
</svg>
<span>Apple</span>
</button>
<!-- Google Button -->
<button class="h-14 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-space-sm active:scale-[0.98] transition-all cursor-pointer shadow-sm" type="button">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M21.35 11.1h-9.17v2.98h5.27c-.23 1.22-.92 2.26-1.95 2.96v2.46h3.15c1.84-1.7 2.9-4.2 2.9-7.15 0-.69-.06-1.35-.2-1.97v-.29z"></path>
<path d="M12.18 20.45c2.63 0 4.84-.87 6.45-2.37l-3.15-2.46c-.87.59-1.99.94-3.3.94-2.54 0-4.69-1.71-5.46-4.02H3.45v2.53c1.64 3.26 5.01 5.46 8.73 5.46z"></path>
<path d="M6.72 12.54c-.2-.59-.31-1.22-.31-1.87s.11-1.28.31-1.87V6.27H3.45C2.79 7.58 2.42 9.07 2.42 10.67s.37 3.09 1.03 4.4l3.27-2.53z"></path>
<path d="M12.18 4.79c1.43 0 2.72.49 3.73 1.45l2.8-2.8C17.01 1.83 14.8 1 12.18 1 8.46 1 5.09 3.2 3.45 6.47l3.27 2.53c.77-2.31 2.92-4.21 5.46-4.21z"></path>
</svg>
<span>Google</span>
</button>
</div>
<!-- Quick Biometrics Option -->
<div class="mt-space-lg flex flex-col items-center">
<button aria-label="Entrar com Biometria" class="w-12 h-12 rounded-full bg-surface-container-high text-primary-container flex items-center justify-center active:scale-90 transition-transform shadow-md" type="button">
<span class="material-symbols-outlined text-[26px]">fingerprint</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-space-xs uppercase tracking-wider">
        Face ID / Biometria
      </span>
</div>
<!-- Registration Link Footer -->
<div class="mt-space-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        Não tem uma conta? 
        <a class="font-label-md text-label-md text-primary-container hover:underline ml-1 inline-flex items-center gap-0.5" href="#cadastrar">
          Cadastre-se
          <span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
