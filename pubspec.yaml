name: diario_fit
description: "Diário Fit: treinos funcionais e de hipertrofia com cronograma, cronômetro e histórico."
publish_to: 'none'

# versão visível + número do build (versionCode no Android, CFBundleVersion no iOS)
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.8.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo_mark.png

# Ícone do app. Fontes em assets/icon/*.svg (vindas de "telas app/icone app").
# Regerar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/icon_bg.png
  adaptive_icon_foreground: assets/icon/icon_fg.png
  adaptive_icon_foreground_inset: 0 # icon_fg.png já vem com a margem da área segura
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0F0F12"
    theme_color: "#0F0F12"

# Tela de abertura. Regerar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F0F12"
  image: assets/icon/icon_fg.png
  android_12:
    color: "#0F0F12"
    image: assets/icon/icon_fg.png
  web: false
